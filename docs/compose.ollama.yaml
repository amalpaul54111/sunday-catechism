# Ollama overlay for the Sunday Catechism "Import from Photo" (OCR) feature.
#
# Adds a local Ollama service that the Frappe backend reaches at
# http://ollama:11434 (the default in OCR Settings). Only needed when the OCR
# engine is set to "Ollama".
#
# Usage — merge this overlay on top of frappe_docker's compose.yaml:
#   docker compose \
#     -f compose.yaml \
#     -f apps/sunday_catechism/docs/compose.ollama.yaml \
#     up -d
#
# Then pull the model once (~3 GB):
#   docker compose exec ollama ollama pull qwen2.5vl:3b

services:
  ollama:
    image: ollama/ollama:latest
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ollama:/root/.ollama
    # GPU opt-in: uncomment to use an NVIDIA GPU (needs the NVIDIA container toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama:
